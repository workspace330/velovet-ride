<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Velovet Ride - Indoor Cycling App</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <style>
    :root {
      --bg-dark: #121214;
      --bg-card: rgba(24, 24, 28, 0.85);
      --bg-card-solid: #18181c;
      --accent-orange: #fc5200;
      --accent-cyan: #00f0ff;
      --accent-green: #00e676;
      --accent-red: #ff1744;
      --text-main: #ffffff;
      --text-muted: #a0a0ab;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Top iOS / Bluefy Notice Banner */
    #ios-notice {
      background: linear-gradient(90deg, #ff9100, #fc5200);
      color: #000;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 6px 12px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #ios-notice button {
      background: rgba(0,0,0,0.2);
      border: none;
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    /* App Header */
    header {
      background-color: var(--bg-card-solid);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 500;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(45deg, #fff, var(--accent-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* Dynamic Bluetooth Connection Button */
    .btn-ble {
      background-color: #3a3a42;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: not-allowed;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-ble.ready {
      background-color: var(--accent-green);
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
    }
    .btn-ble.riding {
      background-color: var(--accent-orange);
      color: #fff;
      cursor: pointer;
    }

    /* Main Grid Layout */
    .app-container {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      grid-template-rows: 1fr 140px;
      height: calc(100vh - 50px);
      position: relative;
    }

    @media (max-width: 1024px) {
      .app-container {
        grid-template-columns: 280px 1fr;
        grid-template-rows: 1fr 180px auto;
        overflow-y: auto;
      }
      .right-panel {
        grid-column: span 2;
      }
    }

    /* Map Display */
    #map {
      grid-column: 2;
      grid-row: 1;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      z-index: 1;
    }

    /* Left Control Sidebar */
    .left-panel {
      grid-column: 1;
      grid-row: 1 / span 2;
      background-color: var(--bg-card-solid);
      border-right: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      z-index: 10;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* BLE Connect Buttons */
    .ble-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-action {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between
