        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: #000; color: var(--text-light);
            overflow: hidden;
        }
        /* iOS Bluetooth Banner */
        #ios-banner {
            background-color: #ffcc00; color: #000;
            text-align: center; padding: 10px; font-weight: bold;
            font-size: 0.9em; z-index: 2000; position: absolute; width: 100%;
        }
        #ios-banner.hidden { display: none; }
        
        /* Map Background */
        #map { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        
        /* UI Overlays */
        .hud-panel {
            position: absolute; z-index: 10;
            background: var(--bg-dark); border-radius: 12px;
            padding: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
        }

        #stats-panel { top: 50px; left: 20px; min-width: 250px; }

        .stat-label { font-size: 0.9em; text-transform: uppercase; color: #aaa; }
