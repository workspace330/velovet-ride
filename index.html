<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Velovet Ride - Indoor Cycling App</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  
  <style>
    :root {
      --bg-dark: #121214;
      --bg-card: rgba(24, 24, 28, 0.85);
      --bg-card-solid: #18181c;
      --accent-orange: #fc5200;
      --accent-cyan: #00f0ff;
      --accent-green: #00e676;
      --accent-red: #ff1744;
      --text-main: #ffffff;
      --text-muted: #a0a0ab;
      --border-color: rgba(255, 255, 255, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #ios-notice {
      background: linear-gradient(90deg, #ff9100, #fc5200);
      color: #000;
      font-weight: 600;
      font-size: 0.85rem;
      padding: 6px 12px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      z-index: 1000;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }
    #ios-notice button {
      background: rgba(0,0,0,0.2);
      border: none;
      color: #000;
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.75rem;
    }

    header {
      background-color: var(--bg-card-solid);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 500;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(45deg, #fff, var(--accent-orange));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .btn-ble {
      background-color: #3a3a42;
      color: var(--text-muted);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: not-allowed;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn-ble.ready {
      background-color: var(--accent-green);
      color: #000;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(0, 230, 118, 0.4);
    }
    .btn-ble.riding {
      background-color: var(--accent-orange);
      color: #fff;
      cursor: pointer;
    }

    .app-container {
      display: grid;
      grid-template-columns: 320px 1fr 340px;
      grid-template-rows: 1fr 140px;
      height: calc(100vh - 50px);
      position: relative;
    }

    @media (max-width: 1024px) {
      .app-container {
        grid-template-columns: 280px 1fr;
        grid-template-rows: 1fr 180px auto;
        overflow-y: auto;
      }
      .right-panel {
        grid-column: span 2;
      }
    }

    #map {
      grid-column: 2;
      grid-row: 1;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      z-index: 1;
    }

    .left-panel {
      grid-column: 1;
      grid-row: 1 / span 2;
      background-color: var(--bg-card-solid);
      border-right: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      z-index: 10;
    }

    .card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      backdrop-filter: blur(10px);
    }

    .card-title {
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .ble-actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-action {
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      transition: background 0.2s;
    }
    .btn-action:hover {
      background: rgba(255,255,255,0.1);
    }
    .btn-action.connected {
      border-color: var(--accent-green);
      background: rgba(0, 230, 118, 0.1);
    }

    .slider-container {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .slider-val {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-cyan);
      text-align: center;
    }
    input[type=range] {
      width: 100%;
      accent-color: var(--accent-cyan);
    }

    .mode-switch {
      display: flex;
      background: rgba(0,0,0,0.3);
      border-radius: 8px;
      padding: 2px;
      border: 1px solid var(--border-color);
    }
    .mode-btn {
      flex: 1;
      border: none;
      background: none;
      color: var(--text-muted);
      padding: 6px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-weight: 700;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--accent-orange);
      color: #fff;
    }

    .right-panel {
      grid-column: 3;
      grid-row: 1 / span 2;
      background-color: var(--bg-card-solid);
      border-left: 1px solid var(--border-color);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-y: auto;
      z-index: 10;
    }

    .hud-overlay {
      position: absolute;
      top: 70px;
      right: 360px;
      z-index: 500;
      display: flex;
      gap: 12px;
      pointer-events: none;
    }
    @media (max-width: 1024px) {
      .hud-overlay {
        right: 16px;
      }
    }

    .hud-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 12px 18px;
      text-align: center;
      backdrop-filter: blur(12px);
      min-width: 100px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    .hud-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
    }
    .hud-value {
      font-size: 1.8rem;
      font-weight: 900;
      line-height: 1.1;
    }

    .bottom-panel {
      grid-column: 2;
      grid-row: 2;
      background: var(--bg-card-solid);
      border-top: 1px solid var(--border-color);
      position: relative;
      z-index: 10;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
    }
    #elevation-canvas {
      width: 100%;
      height: 100px;
    }

    #log-console {
      font-family: monospace;
      font-size: 0.7rem;
      background: #08080a;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px;
      height: 140px;
      overflow-y: auto;
      color: #00e676;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .log-err { color: #ff1744; }
    .log-warn { color: #ff9100; }
    .log-info { color: #00f0ff; }

    .lb-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.8rem;
    }
    .lb-table th {
      text-align: left;
      color: var(--text-muted);
      padding: 6px;
      border-bottom: 1px solid var(--border-color);
    }
    .lb-table td {
      padding: 6px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }
  </style>
</head>
<body>

    <i class="fa-solid fa-triangle-exclamation"></i>
    <span>Notice: On iOS devices, the <strong>Bluefy Web BLE Browser</strong> or <strong>WebBLE</strong> app is required for Bluetooth connectivity.</span>
    <button onclick="document.getElementById('ios-notice').style.display='none'">Dismiss</button>
  </div>

  <header>
    <div class="brand">
      <i class="fa-solid fa-person-biking fa-lg" style="color: var(--accent-orange);"></i>
      <h1>VELOVET RIDE</h1>
    </div>
    
    <button id="ble-main-cta" class="btn-ble" disabled>
      <i class="fa-bluetooth-b fa-brands"></i>
      <span id="ble-main-cta-text">Waiting for Bluetooth devices...</span>
    </button>
  </header>

      <div class="hud-card">
        <div class="hud-label">Power</div>
        <div class="hud-value" id="hud-power" style="color: var(--accent-orange);">0 <span style="font-size:0.9rem">W</span></div>
      </div>
